<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages — SpriteSwap</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme-v22.css"></head><body data-page="messages"><div id="pageHeader"></div><main class="app-page messages-app-page"><div class="message-page-shell"><section class="messages-page">
  <aside class="messages-sidebar">
    <div class="messages-brand-head"><div><span class="messages-brand-icon">◖</span><strong>Messages</strong></div><small>Accepted trades only</small></div>
    <div class="message-tabs"><button class="active" data-page-message-filter="all">All</button><button data-page-message-filter="unread">Unread</button><button data-page-message-filter="active">Active</button><button data-page-message-filter="closed">Closed</button></div>
    <div class="message-search"><span>⌕</span><input id="conversationSearch" placeholder="Search traders…"></div>
    <div id="conversationList" class="conversation-list"></div>
  </aside>
  <section class="messages-main">
    <header id="messagesChatHead" class="messages-head"><div><strong>Choose an accepted trade</strong><small>Your private trade chats appear here.</small></div></header>
    <div id="pageThread" class="message-thread"></div>
    <form id="pageMessageForm" class="message-form"><input id="pageMessageInput" maxlength="500" placeholder="Accept a trade to message" required disabled><button class="message-send" aria-label="Send">➤</button></form>
  </section>
  <aside id="messagesTrade" class="messages-trade"><div class="trade-side-empty"><div><b>Trade details</b><p class="subtle">Select an accepted trade conversation.</p></div></div></aside>
</section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="sprites-data.js"></script><script src="page-app.js"></script></body></html>
