<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post Trade — SpriteSwap</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme-v15.css"></head><body data-page="new-trade"><div id="pageHeader"></div><main class="app-page"><div class="page-shell form-page"><div class="page-topbar"><div class="page-title"><span class="icon-tile">＋</span><div><h1>Post a trade</h1><p>Create a Sprite-for-Sprite listing.</p></div></div></div><form id="newTradeForm" class="page-card form-card"><label>Offering<input name="offer" list="spriteNames" maxlength="60" required placeholder="e.g. Gold Crown"></label><label>Looking for<input name="want" list="spriteNames" maxlength="60" required placeholder="e.g. Galaxy Aura"></label><label>Variant tier<select name="tier"><option>Base</option><option>Gold</option><option>Cheat Master</option><option>Any</option></select></label><label>Description<textarea name="note" maxlength="240" placeholder="Straight swap, available tonight…"></textarea></label><button class="btn btn-primary" type="submit">Publish trade</button><p id="formNote" class="form-note"></p></form><datalist id="spriteNames"></datalist></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="sprites-data.js"></script><script src="page-app.js"></script></body></html>
